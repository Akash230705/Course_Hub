---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
      - name: springboot-app
        image: akash2316/springboot-app:IMAGE_TAG
        ports:
        - containerPort: 8080